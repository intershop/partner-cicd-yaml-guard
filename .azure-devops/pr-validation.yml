parameters:
  - name: dockerHubServiceConnection
    type: string
    default: dockerhub-public-image-pull

steps:
  - checkout: self
    clean: true

  - task: Docker@2
    displayName: Docker Hub Login
    inputs:
      command: login
      containerRegistry: ${{ parameters.dockerHubServiceConnection }}

  - task: Bash@3
    displayName: YAML Validation - /clusters
    condition: succeededOrFailed()
    inputs:
      targetType: filePath
      filePath: .azure-devops/yaml-validation/run.sh
      workingDirectory: $(Build.SourcesDirectory)

  - task: Bash@3
    displayName: kubeconform Validation - /clusters
    condition: succeededOrFailed()
    inputs:
      targetType: filePath
      filePath: .azure-devops/kubeconform-validation/run.sh
      workingDirectory: $(Build.SourcesDirectory)

  - task: Bash@3
    displayName: Kustomize Validation - /clusters
    condition: succeededOrFailed()
    inputs:
      targetType: filePath
      filePath: .azure-devops/kustomize-validation/run.sh
      workingDirectory: $(Build.SourcesDirectory)

  - task: Bash@3
    displayName: HAProxy Validation - Python in Docker
    condition: succeededOrFailed()
    inputs:
      targetType: filePath
      filePath: .azure-devops/haproxy-validation/run.sh
      workingDirectory: $(Build.SourcesDirectory)

  - task: Docker@2
    displayName: Docker Hub Logout
    condition: always()
    continueOnError: true
    inputs:
      command: logout
      containerRegistry: ${{ parameters.dockerHubServiceConnection }}